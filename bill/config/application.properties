spring.threads.virtual.enabled=true
spring.application.name=bill
server.port=0

spring.cloud.config.enabled=false

#spring.hazelcast.config=classpath:hazelcast-client.xml
hazelcast.cluster.name=flat
hazelcast.server.addresses=127.0.0.1:5701

spring.datasource.url=jdbc:h2:tcp://localhost/demodb;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

#spring.cloud.stream.default-binder=rabbit
spring.cloud.stream.bindings.output-out-0.content-type=application/json
spring.cloud.stream.bindings.output-out-0.destination=bankdemo
#spring.cloud.stream.bindings.output-out-0.group=notifications
#spring.cloud.stream.rabbit.bindings.output-out-0.producer.routing-key=KEY
spring.cloud.stream.bindings.output-out-0.producer.partition-key-expression='KEY'
spring.cloud.stream.bindings.output-out-0.producer.partition-count=1

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# infinispan.remote.server-list=127.0.0.1:11222
# infinispan.remote.host=${infinispan.remote.server-list.split(':')[0]}
# infinispan.remote.port=${infinispan.remote.server-list.split(':')[1]}

eureka.auth=${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}
eureka.instance.hostname=${spring.application.name}
#eureka.instance.ip-address=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${eureka.auth}@localhost:8761/eureka/

management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.shutdown.access=unrestricted
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

spring.boot.admin.client.url=http://localhost:8888
spring.boot.admin.client.enabled=true
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin