server.address=localhost
server.port=0

# spring.web.error.include-message=always
# spring.web.error.include-binding-errors=always

spring.application.name=bill
spring.cache.type=hazelcast

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

logging.level.org.springframework.jdbc.core=TRACE

#spring.cloud.stream.default-binder=rabbit
spring.cloud.stream.bindings.output-out-0.content-type=application/json
spring.cloud.stream.bindings.output-out-0.destination=notifications
spring.cloud.stream.bindings.output-out-0.group=bankdemo
# spring.cloud.function.definition=output

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

