spring.threads.virtual.enabled=true
spring.application.name=operation
server.port=0

external.service=http://localhost:4567
spring.cloud.config.enabled=false
spring.cloud.openfeign.httpclient.hc5.enabled=true

spring.datasource.url=jdbc:h2:tcp://localhost/demodb;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
#spring.datasource.generate-unique-name=false
spring.datasource.hikari.auto-commit=false

#spring.sql.init.platform=postgre
spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:/schema-postgre.sql
#spring.sql.init.data-locations=classpath:/data-postgre.sql
spring.sql.init.continue-on-error=false

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

eureka.auth=${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}
eureka.instance.hostname=${spring.application.name}
#eureka.instance.ip-address=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${eureka.auth}@localhost:8761/eureka/

management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.shutdown.access=unrestricted
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

spring.boot.admin.client.url=http://localhost:8888
spring.boot.admin.client.enabled=true
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin