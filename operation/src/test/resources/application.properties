server.address=localhost
server.port=0

spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true
eureka.client.enabled=false

spring.cloud.openfeign.httpclient.hc5.enabled=true
#spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.circuitbreaker.enabled=false

spring.application.name=operation
spring.main.allow-bean-definition-overriding=true
spring.threads.virtual.enabled=true

#spring.cloud.loadbalancer.enabled=false
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=0
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=0
spring.cloud.discovery.client.simple.instances.bill[0].uri=http://localhost:8761

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

logging.level.org.springframework.jdbc.core=TRACE

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# spring.zipkin.enabled=false
# spring.sleuth.enabled=false
# spring.sleuth.reactor.enabled=false
# spring.sleuth.web.enabled=false
# spring.sleuth.web.client.enabled=false
# spring.sleuth.async.enabled=false

spring.boot.admin.client.enabled=false