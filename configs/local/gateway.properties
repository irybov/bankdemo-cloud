springdoc.swagger-ui.path=/swagger-ui
server.port=8080

app.eureka-server=http://${eureka.host}
app.admin-server=http://${ADMIN_SERVICE_NAME:localhost}:8989
app.zipkin-server=http://${ZIPKIN_SERVICE_NAME:localhost}:9411

eureka.client.register-with-eureka=false
#eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${app.zipkin-server}/api/v2/spans

# Allow forwarded headers in Spring Cloud Gateway 2025 WebFlux
spring.cloud.gateway.server.webflux.trusted-proxies=.*
spring.cloud.gateway.server.webflux.x-forwarded.enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.host-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.proto-enabled=true
#spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=4s

# Downstream OpenAPI definitions for the dropdown
springdoc.swagger-ui.urls[0].name=account
springdoc.swagger-ui.urls[0].url=/v3/api-docs/account
springdoc.swagger-ui.urls[1].name=bill
springdoc.swagger-ui.urls[1].url=/v3/api-docs/bill
springdoc.swagger-ui.urls[2].name=operation
springdoc.swagger-ui.urls[2].url=/v3/api-docs/operation
# Account Service API docs
spring.cloud.gateway.server.webflux.routes[20].id=account-docs
spring.cloud.gateway.server.webflux.routes[20].uri=lb://account
spring.cloud.gateway.server.webflux.routes[20].predicates[0]=Path=/v3/api-docs/account
spring.cloud.gateway.server.webflux.routes[20].filters[0]=RewritePath=/v3/api-docs/account, /v3/api-docs/public-apis
spring.cloud.gateway.server.webflux.routes[20].filters[1]=AddRequestHeader=X-Forwarded-Host, localhost:8080
spring.cloud.gateway.server.webflux.routes[20].filters[2]=AddRequestHeader=X-Forwarded-Proto, http
# Bill Service API docs
spring.cloud.gateway.server.webflux.routes[21].id=bill-docs
spring.cloud.gateway.server.webflux.routes[21].uri=lb://bill
spring.cloud.gateway.server.webflux.routes[21].predicates[0]=Path=/v3/api-docs/bill
spring.cloud.gateway.server.webflux.routes[21].filters[0]=RewritePath=/v3/api-docs/bill, /v3/api-docs/public-apis
spring.cloud.gateway.server.webflux.routes[21].filters[1]=AddRequestHeader=X-Forwarded-Host, localhost:8080
spring.cloud.gateway.server.webflux.routes[21].filters[2]=AddRequestHeader=X-Forwarded-Proto, http
# Operation Service API docs
spring.cloud.gateway.server.webflux.routes[22].id=operation-docs
spring.cloud.gateway.server.webflux.routes[22].uri=lb://operation
spring.cloud.gateway.server.webflux.routes[22].predicates[0]=Path=/v3/api-docs/operation
spring.cloud.gateway.server.webflux.routes[22].filters[0]=RewritePath=/v3/api-docs/operation, /v3/api-docs/public-apis
spring.cloud.gateway.server.webflux.routes[22].filters[1]=AddRequestHeader=X-Forwarded-Host, localhost:8080
spring.cloud.gateway.server.webflux.routes[22].filters[2]=AddRequestHeader=X-Forwarded-Proto, http

## External Service Route
spring.cloud.gateway.server.webflux.routes[19].id=external-service
spring.cloud.gateway.server.webflux.routes[19].uri=http://localhost:4567
spring.cloud.gateway.server.webflux.routes[19].predicates[0]=Path=/javalin/display
spring.cloud.gateway.server.webflux.routes[19].filters[0]=StripPrefix=1

