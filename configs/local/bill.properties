spring.threads.virtual.enabled=true
server.forward-headers-strategy=framework

#spring.hazelcast.config=classpath:hazelcast-client.xml
hazelcast.cluster.name=flat
hazelcast.server.addresses=127.0.0.1:5701

spring.datasource.url=jdbc:h2:tcp://localhost/demodb;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

#spring.cloud.stream.default-binder=rabbit
spring.cloud.stream.bindings.output-out-0.content-type=application/json
spring.cloud.stream.bindings.output-out-0.destination=bankdemo
#spring.cloud.stream.bindings.output-out-0.group=notifications
#spring.cloud.stream.rabbit.bindings.output-out-0.producer.routing-key=KEY
spring.cloud.stream.bindings.output-out-0.producer.partition-key-expression='KEY'
spring.cloud.stream.bindings.output-out-0.producer.partition-count=1

spring.rabbitmq.host=${RABBITMQ_HOSTNAME:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${ZIPKIN_SERVICE_NAME:localhost}:9411/api/v2/spans

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.shutdown.access=unrestricted
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

spring.boot.admin.client.instance.service-base-url=http://${spring.application.name:localhost}:8080
spring.boot.admin.client.url=http://${ADMIN_SERVICE_NAME:localhost}:8989
spring.boot.admin.client.enabled=false
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=${ADMIN_USERNAME:admin}
spring.boot.admin.client.password=${ADMIN_PASSWORD:admin}