spring.threads.virtual.enabled=true
spring.application.name=notificator
server.port=0

spring.cloud.config.enabled=false

spring.cloud.stream.bindings.input.content-type=application/json
spring.cloud.stream.bindings.input.destination=bankdemo
spring.cloud.stream.bindings.input.group=notifications
spring.cloud.stream.rabbit.bindings.input-in-0.consumer.binding-routing-key=KEY
spring.cloud.stream.bindings.input.consumer.max-attempts=1
spring.cloud.stream.bindings.input.consumer.retryable-exceptions.java.lang.Exception=true
spring.cloud.stream.rabbit.bindings.input.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.bindings.input.consumer.republish-to-dlq=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

eureka.auth=${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}
eureka.instance.hostname=${spring.application.name}
#eureka.instance.ip-address=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${eureka.auth}@localhost:8761/eureka/

management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.shutdown.access=unrestricted
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

spring.boot.admin.client.url=http://localhost:8888
spring.boot.admin.client.enabled=true
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin