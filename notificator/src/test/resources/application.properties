spring.cloud.stream.bindings.input.group=bankdemo
spring.cloud.stream.rabbit.bindings.input.consumer.binding-routing-key=KEY
spring.cloud.stream.bindings.input.consumer.max-attempts=1
spring.cloud.stream.bindings.input.consumer.retryable-exceptions.java.lang.Exception=false
