spring.threads.virtual.enabled=true

#spring.cloud.stream.default-binder=rabbit
#spring.cloud.stream.default.consumer.auto-startup=false
spring.cloud.stream.bindings.input.content-type=application/json
spring.cloud.stream.bindings.input.destination=notifications
spring.cloud.stream.bindings.input.group=bankdemo
spring.cloud.stream.rabbit.bindings.input-in-0.consumer.binding-routing-key=KEY
spring.cloud.stream.bindings.input.consumer.max-attempts=1
spring.cloud.stream.bindings.input.consumer.retryable-exceptions.java.lang.Exception=true
#spring.cloud.stream.bindings.input.producer.auto-startup=false
spring.cloud.stream.rabbit.bindings.input.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.bindings.input.consumer.republish-to-dlq=false

spring.rabbitmq.host=192.168.1.101
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${ZIPKIN_SERVICE_NAME:localhost}:9411/api/v2/spans

spring.zipkin.base-url=http://${ZIPKIN_SERVICE_NAME:localhost}:9411
# spring.sleuth.sampler.probability=1.0
# spring.sleuth.integration.enabled=true

management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
#management.server.port:8888
management.health.mail.enabled=false

spring.boot.admin.client.instance.service-base-url=http://${ADMIN_SERVICE_NAME:localhost}:8080
spring.boot.admin.client.url=http://${ADMIN_SERVICE_NAME:localhost}:8080
spring.boot.admin.client.enabled=true
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin