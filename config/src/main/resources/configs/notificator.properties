server.address=localhost
server.port=${PORT:0}

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*
management.endpoints.enabled-by-default=true

#spring.cloud.stream.default-binder=rabbit
#spring.cloud.stream.default.consumer.auto-startup=false
spring.cloud.stream.bindings.input.content-type=application/json
spring.cloud.stream.bindings.input.destination=notifications
spring.cloud.stream.bindings.input.group=bankdemo
spring.cloud.stream.rabbit.bindings.input-in-0.consumer.binding-routing-key=KEY
spring.cloud.stream.bindings.input.consumer.max-attempts=1
spring.cloud.stream.bindings.input.consumer.retryable-exceptions.java.lang.Exception=true
#spring.cloud.stream.bindings.input.producer.auto-startup=false
spring.cloud.stream.rabbit.bindings.input.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.bindings.input.consumer.republish-to-dlq=false

spring.rabbitmq.host=192.168.1.101
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
spring.sleuth.integration.enabled=true