app.eureka-server=http://${EUREKA_HOSTNAME:eureka}:8761
app.admin-server=http://${ADMIN_SERVICE_NAME:admin}:8080

eureka.client.register-with-eureka=false
#eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessState.enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${ZIPKIN_SERVICE_NAME:localhost}:9411/api/v2/spans

spring.zipkin.base-url=http://${ZIPKIN_SERVICE_NAME:localhost}:9411
# spring.sleuth.sampler.probability=0.0
# spring.sleuth.reactor.instrumentation-type=decorate-queues
#spring.sleuth.web.client.enabled=false

#spring.cloud.gateway.server.webflux.default-filters=RemoveRequestHeader=Cookie
spring.cloud.gateway.default-filters[0].name=RemoveRequestHeader
spring.cloud.gateway.default-filters[0].args.name=Cookie
spring.cloud.gateway.default-filters[0].expression=!local.request.path.value.startsWith('/admin')

## Discovery Server Route
spring.cloud.gateway.server.webflux.routes[0].id=eureka-server
spring.cloud.gateway.server.webflux.routes[0].uri=${app.eureka-server}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eureka
spring.cloud.gateway.server.webflux.routes[0].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[0].filters[1]=StripPrefix=1
## Discovery Server Static Resources Route
spring.cloud.gateway.server.webflux.routes[10].id=eureka-server
spring.cloud.gateway.server.webflux.routes[10].uri=${app.eureka-server}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/eureka/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=PreserveHostHeader
#spring.cloud.gateway.server.webflux.routes[0].filters[1]=StripPrefix=1

## Admin Server Route
spring.cloud.gateway.server.webflux.routes[9].id=admin-server
spring.cloud.gateway.server.webflux.routes[9].uri=no://op
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/admin
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RedirectTo=302, /admin/
## Admin Server Static Resources Route
spring.cloud.gateway.server.webflux.routes[1].id=admin-static
spring.cloud.gateway.server.webflux.routes[1].uri=${app.admin-server}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/admin/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=PreserveHostHeader
