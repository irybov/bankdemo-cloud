token.secret=rAUOQK5LF3s0unfY8jbOkJc8Ep9H9v3Y
token.lifetime=300

spring.cloud.gateway.server.webflux.default-filters=RemoveRequestHeader=Cookie
## Discover Server Route
spring.cloud.gateway.server.webflux.routes[0].id=eureka-server
spring.cloud.gateway.server.webflux.routes[0].uri=${app.eureka-server}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eureka
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/

## Discover Server Static Resources Route
spring.cloud.gateway.server.webflux.routes[1].id=eureka-static
spring.cloud.gateway.server.webflux.routes[1].uri=${app.eureka-server}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/eureka/**

