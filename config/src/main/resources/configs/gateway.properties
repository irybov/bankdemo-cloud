## Account
spring.cloud.gateway.server.webflux.routes[2].id=account-login,registration
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/accounts
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=HEAD,POST

spring.cloud.gateway.server.webflux.routes[3].id=account-getAll
spring.cloud.gateway.server.webflux.routes[3].uri=lb://account
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/accounts
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[3].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthorizationHeaderFilter=ROLE_ADMIN

spring.cloud.gateway.server.webflux.routes[4].id=account-getOne,changePassword
spring.cloud.gateway.server.webflux.routes[4].uri=lb://account
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/accounts/*
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=GET,PATCH
spring.cloud.gateway.server.webflux.routes[4].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[4].filters[0]=AuthorizationHeaderFilter=ROLE_ADMIN ROLE_CLIENT

spring.cloud.gateway.server.webflux.routes[5].id=account-addBill
spring.cloud.gateway.server.webflux.routes[5].uri=lb://account
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/accounts/*/*
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[5].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[5].filters[0]=AuthorizationHeaderFilter=ROLE_CLIENT

spring.cloud.gateway.server.webflux.routes[6].id=account-deleteBill
spring.cloud.gateway.server.webflux.routes[6].uri=lb://account
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/accounts/**
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=DELETE
spring.cloud.gateway.server.webflux.routes[6].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[6].filters[0]=AuthorizationHeaderFilter=ROLE_CLIENT

