spring.zipkin.base-url=http://${ZIPKIN_SERVICE_NAME:zipkin}:9411

app.eureka-server=http://${EUREKA_HOSTNAME:eureka}:8761
app.admin-server=http://${ADMIN_SERVICE_NAME:admin}:8080

eureka.client.register-with-eureka=false
#eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessState.enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${spring.zipkin.base-url}/api/v2/spans

# spring.sleuth.sampler.probability=0.0
# spring.sleuth.reactor.instrumentation-type=decorate-queues
#spring.sleuth.web.client.enabled=false

#spring.cloud.gateway.server.webflux.default-filters=RemoveRequestHeader=Cookie
spring.cloud.gateway.default-filters[0].name=RemoveRequestHeader
spring.cloud.gateway.default-filters[0].args.name=Cookie
spring.cloud.gateway.default-filters[0].expression=!local.request.path.value.startsWith('/admin')

## Discovery Server Route
spring.cloud.gateway.server.webflux.routes[0].id=eureka-server
spring.cloud.gateway.server.webflux.routes[0].uri=${app.eureka-server}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eureka
spring.cloud.gateway.server.webflux.routes[0].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[0].filters[1]=StripPrefix=1
## Discovery Server Static Resources Route
spring.cloud.gateway.server.webflux.routes[10].id=eureka-static
spring.cloud.gateway.server.webflux.routes[10].uri=${app.eureka-server}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/eureka/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=PreserveHostHeader
#spring.cloud.gateway.server.webflux.routes[0].filters[1]=StripPrefix=1

## Zipkin Dashboard
spring.cloud.gateway.server.webflux.routes[11].id=zipkin-server
spring.cloud.gateway.server.webflux.routes[11].uri=no://op
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/zipkin
spring.cloud.gateway.server.webflux.routes[11].filters[0]=RedirectTo=302, ./zipkin/
## Zipkin Dashboard Static Resources Route
spring.cloud.gateway.server.webflux.routes[12].id=zipkin-static
spring.cloud.gateway.server.webflux.routes[12].uri=${spring.zipkin.base-url}
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/zipkin/**
#spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/zipkin/(?<segment>.*), /${segment}

## Intercepts the post-logout break and fixes the path loop
spring.cloud.gateway.server.webflux.routes[13].id=rabbitmq-logout-fix
spring.cloud.gateway.server.webflux.routes[13].uri=http://localhost
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/
# If coming from the RabbitMQ client session referer, force them to the login sub-path
spring.cloud.gateway.server.webflux.routes[13].predicates[1]=Header=Referer, .*rabbitmq.*
spring.cloud.gateway.server.webflux.routes[13].filters[0]=RedirectTo=302, /rabbitmq/
## RabbitMQ Dashboard
spring.cloud.gateway.server.webflux.routes[14].id=rabbitmq-server
spring.cloud.gateway.server.webflux.routes[14].uri=no://op
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/rabbitmq
spring.cloud.gateway.server.webflux.routes[14].filters[0]=RedirectTo=302, /rabbitmq/
## RabbitMQ Dashboard Static Resources Route
spring.cloud.gateway.server.webflux.routes[15].id=rabbitmq-static
spring.cloud.gateway.server.webflux.routes[15].uri=http://${RABBITMQ_HOSTNAME:rabbitmq}:15672
spring.cloud.gateway.server.webflux.routes[15].predicates[0]=Path=/rabbitmq/**
spring.cloud.gateway.server.webflux.routes[15].metadata.options.keep-encoded-paths=true
spring.cloud.gateway.server.webflux.routes[15].filters[0]=PreserveHostHeader
#spring.cloud.gateway.server.webflux.routes[15].filters[0]=StripPrefix=1
#spring.cloud.gateway.server.webflux.routes[15].filters[0]=AddRequestHeader=Authorization, Basic Z3Vlc3Q6Z3Vlc3M=
#spring.cloud.gateway.server.webflux.routes[15].filters[1]=AddRequestHeader=Authorization, Basic ${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}

## Admin Server Route
spring.cloud.gateway.server.webflux.routes[9].id=admin-server
spring.cloud.gateway.server.webflux.routes[9].uri=no://op
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/admin
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RedirectTo=302, /admin/
## Admin Server Static Resources Route
spring.cloud.gateway.server.webflux.routes[1].id=admin-static
spring.cloud.gateway.server.webflux.routes[1].uri=${app.admin-server}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/admin/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=PreserveHostHeader
#spring.cloud.gateway.server.webflux.routes[1].filters[1]=StripPrefix=1
#spring.cloud.gateway.server.webflux.routes[10].filters[2]=AddRequestHeader=Authorization, Basic YWRtaW46YWRtaW4=
#spring.cloud.gateway.server.webflux.routes[10].filters[2]=AddRequestHeader=Authorization, Basic "${admin_secret}"

## Account Service
spring.cloud.gateway.server.webflux.routes[2].id=account-login,registration
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/accounts
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=HEAD,POST

spring.cloud.gateway.server.webflux.routes[3].id=account-getAll
spring.cloud.gateway.server.webflux.routes[3].uri=lb://account
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/accounts
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[3].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthorizationHeaderFilter=ROLE_ADMIN

spring.cloud.gateway.server.webflux.routes[4].id=account-getOne,changePassword
spring.cloud.gateway.server.webflux.routes[4].uri=lb://account
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/accounts/*
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=GET,PATCH
spring.cloud.gateway.server.webflux.routes[4].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[4].filters[0]=AuthorizationHeaderFilter=ROLE_ADMIN ROLE_CLIENT

spring.cloud.gateway.server.webflux.routes[5].id=account-addBill
spring.cloud.gateway.server.webflux.routes[5].uri=lb://account
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/accounts/*/*
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[5].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[5].filters[0]=AuthorizationHeaderFilter=ROLE_CLIENT

spring.cloud.gateway.server.webflux.routes[6].id=account-deleteBill
spring.cloud.gateway.server.webflux.routes[6].uri=lb://account
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/accounts/**
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=DELETE
spring.cloud.gateway.server.webflux.routes[6].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[6].filters[0]=AuthorizationHeaderFilter=ROLE_CLIENT

