spring.sql.init.continue-on-error=false

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${ZIPKIN_SERVICE_NAME:localhost}:9411/api/v2/spans

spring.zipkin.base-url=http://${ZIPKIN_SERVICE_NAME:localhost}:9411
# spring.sleuth.sampler.probability=1.0

#feign.circuitbreaker.enabled=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

management.endpoint.env.keys-to-sanitize=
management.endpoint.configprops.keys-to-sanitize=
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
#management.server.port:8888
management.health.mail.enabled=false

spring.boot.admin.client.instance.service-base-url=http://${spring.application.name:localhost}:8080
spring.boot.admin.client.url=http://${ADMIN_SERVICE_NAME:localhost}:8080
spring.boot.admin.client.enabled=true
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin