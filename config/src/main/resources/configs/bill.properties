spring.threads.virtual.enabled=true
#spring.hazelcast.config=classpath:hazelcast-client.xml
hazelcast.cluster.name=${HAZELCAST_CLUSTER_NAME}
hazelcast.server.addresses=${HAZELCAST_SERVER_ADDRESSES}

#spring.datasource.url=jdbc:h2:tcp://host.docker.internal:9092/C:/Users/Ivan/demodb;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.auto-commit=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

#spring.cloud.stream.default-binder=rabbit
spring.cloud.stream.bindings.output-out-0.content-type=application/json
spring.cloud.stream.bindings.output-out-0.destination=notifications
spring.cloud.stream.bindings.output-out-0.group=bankdemo

spring.rabbitmq.host=${RABBITMQ_HOSTNAME}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${ZIPKIN_SERVICE_NAME:localhost}:9411/api/v2/spans

spring.zipkin.base-url=http://${ZIPKIN_SERVICE_NAME:localhost}:9411
# spring.sleuth.sampler.probability=1.0
# spring.sleuth.integration.enabled=true

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# infinispan.remote.server-list=127.0.0.1:11222
# infinispan.remote.host=${infinispan.remote.server-list.split(':')[0]}
# infinispan.remote.port=${infinispan.remote.server-list.split(':')[1]}

management.endpoint.env.keys-to-sanitize=
management.endpoint.configprops.keys-to-sanitize=
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
#management.server.port:8888
management.health.mail.enabled=false

spring.boot.admin.client.instance.service-base-url=http://${spring.application.name:localhost}:8080
spring.boot.admin.client.url=http://${ADMIN_SERVICE_NAME:localhost}:8080
spring.boot.admin.client.enabled=true
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin