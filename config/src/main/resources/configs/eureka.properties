server.port=8761
spring.threads.virtual.enabled=true

eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

spring.security.user.name=eureka
spring.security.user.password=eureka
#spring.security.user.roles=ADMIN

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${ZIPKIN_SERVICE_NAME:localhost}:9411/api/v2/spans

spring.zipkin.discovery-client-enabled=false
spring.zipkin.base-url=http://${ZIPKIN_SERVICE_NAME:localhost}:9411
# spring.sleuth.sampler.probability=0.0

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessState.enabled=true