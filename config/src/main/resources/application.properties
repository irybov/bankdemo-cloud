server.address=0.0.0.0
server.port=8888

spring.application.name=config

spring.profiles.active=native
spring.cloud.config.server.native.searchLocations=file:/app/configs/,file:/app/configs/{application}/
spring.cloud.config.server.native.add-label-locations=false
spring.cloud.config.server.native.fail-on-error=true
#spring.cloud.config.server.composite=file:/app/configs/,file:/app/configs/{application}/,env
#spring.cloud.config.server.fail-on-composite-error=true
#spring.cloud.config.server.composite[0].type=native
#spring.cloud.config.server.composite[0].search-locations=file:/app/configs/,file:/app/configs/{application}/

spring.security.user.name=config
spring.security.user.password=config
#spring.security.user.roles=CONFIG

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true